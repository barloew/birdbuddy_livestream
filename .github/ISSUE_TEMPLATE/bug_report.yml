name: Bug report
description: Something is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before posting, please remove `Authorization` headers, refresh tokens
        and `SessionToken` values from any logs.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.7.1"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: go2rtc
    attributes:
      label: Using go2rtc?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        Enable debug logging and include one full start attempt.
      render: text
